services:
  - type: web
    name: sarva-one-server
    runtime: node
    rootDir: license-manager/sarva-one-server
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: API_KEY
        sync: false
      - key: LICENSE_PRIVATE_KEY
        sync: false
      - key: LICENSE_PUBLIC_KEY
        sync: false
      - key: MACHINE_ID_HASH_SECRET
        sync: false
      - key: ADMIN_ORIGIN
        value: https://sarva1.vercel.app
